<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        CSS Text & Background Properties
    </title>
    <style>
        body {
            background-color: #fce4ec; /* light pink */
            background-image: url("https://picsum.photos/1200/800");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            font-family: Arial, sans-serif;
        }
        #box{border: solid #fce4ec 5px;
        width: 200px;
        height:200px;
        padding-left: 50px;
        padding-top: 50px;
        }
        #mypara {
            word-spacing: 10px;
            line-height: 35px;
            text-transform: uppercase;
            background-color: bisque;
            padding: 10px;
        }
img{display:block; margin:0 auto;}
    </style>
</head>
<body>
    <h1>Display property</h1>
    <div>My div</div>
    <p id="box">
        Lorem ipsum dolor sit amet consectetur adipisicing elit.
        Voluptatem iure tempora fugit consectetur cumque.
    </p>
    <br><br>
    <a href="#">Link <span>test</span></a>
    <img src="https://picsum.photos/300/200" alt="Sample image">
<h1 id="box">box model</h1>
</body>
</html>
